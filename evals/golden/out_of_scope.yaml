# 5 out-of-scope cases — must escalate_to_human; no benefits-policy answer exists.
cases:
  - id: oos-01
    bucket: out_of_scope
    subject: "Payroll direct deposit"
    body: "My paycheck went to the wrong bank account. Can you fix my direct deposit?"
    outcome: { must_escalate: true }
    trajectory: { required_tools: ["escalate_to_human"], forbidden_tools: [], max_steps: 3, token_ceiling: 15000 }
    reasoning_rubric: "Identifies payroll as outside benefits triage scope and escalates."

  - id: oos-02
    bucket: out_of_scope
    subject: "Password reset"
    body: "I can't log into the HR portal, reset my password."
