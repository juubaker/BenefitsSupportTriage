# 10 multi-hop cases — require >=2 retrieval calls; where GraphRAG's value would show.
cases:
  - id: multihop-01
    bucket: multihop
    subject: "Spouse job loss — add to plan or COBRA?"
    body: "My wife was laid off and loses coverage end of month. Can I add her mid-year, and how does that compare to her taking COBRA?"
    outcome: { category: "enrollment", priority: "high", grounding_ids: ["chunk-qle-12", "chunk-cobra-04"] }
    trajectory: { required_tools: ["search_policies", "triage_ticket"], max_steps: 6, min_retrieval_calls: 2 }
    reasoning_rubric: "Addresses BOTH the QLE special-enrollment path and the COBRA comparison, citing evidence for each."

  - id: multihop-02
    bucket: multihop
    subject: "Moving states — plan and HSA impact"
    body: "I'm relocating to another state next month. Does my HMO still work there, and does the move change my HSA eligibility?"
    outcome: { category: "eligibility", priority: "medium", grounding_ids: ["chunk-hmo-network-02", "chunk-hsa-22"] }
    trajectory: { required_tools: ["search_policies", "triage_ticket"], max_steps: 6, min_retrieval_calls: 2 }
    reasoning_rubric: "Separately resolves network coverage in the new state and HSA eligibility effects."

  - id: multihop-03
    bucket: multihop
    subject: "Divorce — remove spouse and change FSA"
    body: "My divorce finalizes this month. I need to drop my ex from coverage and I want to reduce my FSA election — can I?"
    outcome: { category: "enrollment", priority: "high", grounding_ids: ["chunk-qle-12", "chunk-fsa-07"] }
    trajectory: { required_tools: ["search_policies", "triage_ticket"], max_steps: 6, min_retrieval_calls: 2 }
    reasoning_rubric: "Treats divorce as a QLE permitting both the dependent removal and the FSA change."

  - id: multihop-04
    bucket: multihop
    subject: "New hire — enrollment window and 401k start"
    body: "I just started. When must I enroll in health benefits, and when am I eligible for the 401k match?"
