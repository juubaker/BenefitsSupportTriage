<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #e5e7eb; --text: #111827;
  --muted: #6b7280; --link: #2563eb; --accent: #2563eb; --hover: #f3f4f6;
  --chip-bg: #eef2ff; --chip-text: #4338ca; --seg-active: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  --banner-a: #4f46e5; --banner-b: #7c3aed; --banner-text: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --border: #232a33; --text: #e6edf3;
  --muted: #8b949e; --link: #6ea8fe; --accent: #6ea8fe; --hover: #1c232c;
  --chip-bg: #1f2937; --chip-text: #93c5fd; --seg-active: #0d1117;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --banner-a: #3730a3; --banner-b: #6d28d9; --banner-text: #f5f3ff;
}
* { box-sizing: border-box; }
body {
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.banner {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; background: linear-gradient(135deg, var(--banner-a), var(--banner-b));
  color: var(--banner-text); border-radius: 18px; padding: 1.6rem 1.5rem;
  box-shadow: var(--shadow); margin-bottom: 1.6rem; overflow: hidden;
}
.banner::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); pointer-events: none;
}
.banner-main { display: flex; align-items: center; gap: 1.1rem; min-width: 0; }
.logo, .monogram { flex: none; width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.logo { object-fit: cover; background: rgba(255,255,255,.15); }
.monogram { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; background: rgba(255,255,255,.18); color: #fff; }
.banner h1 { font-size: 1.55rem; font-weight: 650; margin: 0; letter-spacing: -.01em; line-height: 1.15; word-break: break-word; }
.banner .subtitle { margin: .2rem 0 0; opacity: .9; font-size: .9rem; }
.banner .summary { margin: .45rem 0 0; opacity: .82; font-size: .82rem; }
.theme-btn {
  position: relative; z-index: 1; flex: none; cursor: pointer; border: 1px solid rgba(255,255,255,.3);
  background: rgba(255,255,255,.14); color: #fff; border-radius: 10px; padding: .5rem .7rem;
  font-size: 1.05rem; line-height: 1; transition: background .15s;
}
.theme-btn:hover { background: rgba(255,255,255,.26); }
.toolbar { display: flex; gap: .75rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 200px; padding: .7rem .95rem; font-size: .95rem;
  border: 1px solid var(--border); border-radius: 11px; background: var(--panel);
  color: var(--text); box-shadow: var(--shadow); outline: none;
}
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.segmented { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 3px; box-shadow: var(--shadow); }
.segmented button {
  cursor: pointer; border: none; background: transparent; color: var(--muted);
  font-size: .82rem; font-weight: 550; padding: .45rem .7rem; border-radius: 8px; transition: all .12s;
}
.segmented button:hover { color: var(--text); }
.segmented button.active { background: var(--seg-active); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.section { margin-bottom: 2.25rem; }
.section-head { display: flex; align-items: center; gap: .55rem; margin: 0 0 .75rem; }
.section-head h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 0; }
.count-chip { font-size: .72rem; font-weight: 600; color: var(--chip-text); background: var(--chip-bg); border-radius: 999px; padding: .12rem .5rem; }
ul.list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: .75rem; padding: .7rem .95rem; border-bottom: 1px solid var(--border); transition: background .12s; }
.row:last-child { border-bottom: none; }
.row:hover { background: var(--hover); }
.row .icon { flex: none; font-size: 1.05rem; width: 1.35rem; text-align: center; }
.row a { text-decoration: none; color: var(--link); font-weight: 500; flex: 1; word-break: break-word; }
.row a:hover { text-decoration: underline; }
.row .meta { flex: none; color: var(--muted); font-size: .78rem; white-space: nowrap; }
.empty { padding: 1.1rem .95rem; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 13px; }
.no-results { display: none; padding: 1.5rem; text-align: center; color: var(--muted); }
footer { margin-top: 2.5rem; color: var(--muted); font-size: .78rem; text-align: center; }
</style>
</head>
<body data-default-sort="name">
<div class="wrap">
  <header class="banner">
    <div class="banner-main">
      <div class="monogram">DA</div>
      <div>
        <h1>data</h1>
        <p class="summary">0 files</p>
      </div>
    </div>
    <button id="themeBtn" class="theme-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  </header>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search files…" autocomplete="off">
    <div class="segmented" role="group" aria-label="Sort by">
      <button data-sort="name">Name</button>
      <button data-sort="modified">Modified</button>
      <button data-sort="size">Size</button>
    </div>
  </div>

  <section class="section">
    <div class="section-head"><h2>Files</h2><span class="count-chip">0</span></div>
    <div class="empty">No files to list.</div>
  </section>
  <div id="noResults" class="no-results">No matches.</div>
  <footer>Generated 2026-07-15 15:24</footer>
</div>
<script>
(function () {
  var root = document.documentElement;
  var KEY = "gen_index_theme";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) root.setAttribute("data-theme", saved);
  else root.setAttribute("data-theme",
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

  function icon() { return root.getAttribute("data-theme") === "dark" ? "\u2600\ufe0f" : "\ud83c\udf19"; }
  var btn = document.getElementById("themeBtn");
  if (btn) {
    btn.textContent = icon();
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
      btn.textContent = icon();
    });
  }

  function sortRows(mode) {
    document.querySelectorAll("ul.list").forEach(function (list) {
      var rows = Array.prototype.slice.call(list.querySelectorAll(".row"));
      rows.sort(function (a, b) {
        if (mode === "modified") return (+b.dataset.mtime) - (+a.dataset.mtime);
        if (mode === "size") return (+b.dataset.size) - (+a.dataset.size);
        return a.dataset.name.localeCompare(b.dataset.name);
      });
      rows.forEach(function (r) { list.appendChild(r); });
    });
  }
  var seg = document.querySelectorAll(".segmented button");
  function setActive(mode) {
    seg.forEach(function (b) { b.classList.toggle("active", b.dataset.sort === mode); });
    sortRows(mode);
  }
  seg.forEach(function (b) { b.addEventListener("click", function () { setActive(b.dataset.sort); }); });
  var initial = (document.body.dataset.defaultSort || "name");
  setActive(initial);

  var box = document.getElementById("search");
  if (box) {
    box.addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      document.querySelectorAll(".section").forEach(function (sec) {
        var shown = 0;
        sec.querySelectorAll(".row").forEach(function (row) {
          var match = row.dataset.name.indexOf(q) !== -1;
          row.style.display = match ? "" : "none";
          if (match) shown++;
        });
        sec.style.display = shown === 0 && q ? "none" : "";
      });
      var visible = Array.prototype.some.call(document.querySelectorAll(".row"),
        function (r) { return r.style.display !== "none"; });
      var nr = document.getElementById("noResults");
      if (nr) nr.style.display = visible ? "none" : "block";
    });
  }
})();
</script>
</body>
</html>
