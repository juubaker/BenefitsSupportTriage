name: eval

on:
  pull_request:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 7 * * *"   # nightly full suite + judge

jobs:
  # Fast gate on every PR: agent sub-package typecheck + tests, then the
  # deterministic eval smoke subset. Each package installs in its own dir.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: triage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      AGENT_DEFAULT_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # --- agent/ sub-package: its own install (legacy peers for OTel), typecheck, tests ---
      - name: agent install
        working-directory: agent
        run: npm install --legacy-peer-deps
      - name: agent typecheck
        working-directory: agent
        run: npm run typecheck
      - name: enable pgcrypto (for the live graph traversal test)
        run: psql "$TEST_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
        env: { PGPASSWORD: postgres }
      - name: agent tests
        working-directory: agent
        run: npm test

      # --- evals/ Python: harness self-tests + deterministic smoke gate ---
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: eval deps
        working-directory: evals
        run: pip install -r requirements.txt
      - name: eval harness self-tests
        working-directory: evals
        run: python -m pytest test_eval.py -q
      # The smoke gate below triggers real agent runs; it needs the app + Ollama
      # running and the DB migrated. Left commented until those steps are wired
      # for your repo (db:migrate, seed, start), so CI stays green meanwhile.
      # - name: eval smoke gate (deterministic, 10 cases)
      #   working-directory: evals
      #   run: cp wiring.example.py wiring.py && python -m run --suite smoke --min-pass-rate 0.9

  # Full 40 cases + judge metrics, nightly and on release tags.
  nightly:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: triage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      AGENT_WORKER_FAMILY: claude
      EVAL_JUDGE_MODEL: gpt-4o-mini
      EVAL_JUDGE_FAMILY: gpt
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GRAPH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: agent install
        working-directory: agent
        run: npm install --legacy-peer-deps
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: eval deps
        working-directory: evals
        run: pip install -r requirements.txt
      # Full suite triggers real runs against the API provider — wire the app
      # start + db:migrate for your repo, then uncomment.
      # - name: eval nightly (full 40 + judge)
      #   working-directory: evals
      #   run: cp wiring.example.py wiring.py && python -m run --suite nightly --min-pass-rate 0.85 --out scorecards/nightly.json
