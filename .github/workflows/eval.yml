name: eval

on:
  pull_request:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 7 * * *"   # nightly full suite + judge

jobs:
  # Fast gate on every PR: TS unit tests + deterministic eval smoke subset (Ollama, no API spend).
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: triage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      # Enables the live recursive-CTE graph traversal test (tests/graph.test.ts);
      # without it that test skips. The test manages its own entities/edges tables
      # (DROP/CREATE), so it needs the connection + gen_random_uuid(), not migrations.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      AGENT_DEFAULT_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5   # tool-capable; llama3.1 is the floor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npx tsc --noEmit
      # pgcrypto provides gen_random_uuid() on PG < 13; harmless on newer.
      - name: enable pgcrypto
        run: psql "$TEST_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
        env: { PGPASSWORD: postgres }
      - run: npx vitest run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r eval/requirements.txt
      - run: cd eval && python -m pytest test_eval.py -q     # harness self-tests
      - name: install + warm Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & sleep 3
          ollama pull "$OLLAMA_MODEL"
      - run: npm run db:migrate && npm run seed:corpus
      - name: start app
        run: npm run start & sleep 5
      - name: eval smoke gate (deterministic, 10 cases)
        run: cd eval && cp wiring.example.py wiring.py && python -m run --suite smoke --min-pass-rate 0.9
      - uses: actions/upload-artifact@v4
        with: { name: scorecard-smoke, path: eval/scorecards/latest.json }

  # Full 40 cases + judge metrics, nightly and on release tags.
  nightly:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: triage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/triage
      AGENT_DEFAULT_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_WORKER_FAMILY: claude
      EVAL_JUDGE_MODEL: gpt-4o-mini
      EVAL_JUDGE_FAMILY: gpt
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Flip to "true" once the multihop bucket shows the graph layer earns its
      # place. When true, db:migrate must include the entities/edges tables, the
      # extractor populates them, the tool registers, and graph.yaml cases score.
      GRAPH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r eval/requirements.txt
      - run: npm run db:migrate && npm run seed:corpus
      - name: build policy graph (only when enabled)
        if: env.GRAPH_ENABLED == 'true'
        run: npx tsx scripts/extract-graph.ts
      - run: npm run start & sleep 5
      - name: eval nightly (full 40 + judge; +2 graph cases when enabled)
        run: cd eval && cp wiring.example.py wiring.py && python -m run --suite nightly --min-pass-rate 0.85 --out scorecards/nightly.json
      - uses: actions/upload-artifact@v4
        with: { name: scorecard-nightly, path: eval/scorecards/nightly.json }
