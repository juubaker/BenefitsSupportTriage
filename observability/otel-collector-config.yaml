receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

connectors:
  # Derives RED metrics from spans: runs by terminal state, p50/p95 latency,
  # tool error rate — no separate metrics instrumentation needed yet.
  spanmetrics:
    dimensions:
      - name: agent.terminal_state
      - name: gen_ai.system
      - name: agent.tool.name

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, spanmetrics]
    metrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
